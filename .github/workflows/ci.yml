name: ci

on:
  push:
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Lint web package
        run: bun run workspace:lint
      - name: Lint api package
        run: bun run --filter @esg-rdt/api lint
      - name: Lint worker package
        run: bun run --filter @esg-rdt/worker lint
      - name: Build web package
        run: bun run workspace:build
      - name: Build api package
        run: bun run --filter @esg-rdt/api build
      - name: Build worker package
        run: bun run --filter @esg-rdt/worker build
      - name: Typecheck
        run: bun run typecheck
      - name: API typecheck
        run: bun run --filter @esg-rdt/api typecheck
      - name: Worker typecheck
        run: bun run --filter @esg-rdt/worker typecheck
      - name: Verify Prisma schema
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Skipping db:check for pull_request event."
          elif [ -n "${DATABASE_URL:-}" ]; then
            bun run db:check
          else
            echo "Skipping db:check: DATABASE_URL not set in this CI context."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Test
        run: bun run test

  full-functional-evidence:
    runs-on: ubuntu-latest
    needs:
      - lint-build-test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run strict full-functional checks (token required)
        env:
          FULL_FUNCTIONAL_OFFLINE: "1"
          FULL_FUNCTIONAL_BASE_URL: ${{ vars.NEXT_PUBLIC_WEB_URL || secrets.NEXT_PUBLIC_WEB_URL || 'https://esg-rdt-master-pi.vercel.app' }}
          FULL_FUNCTIONAL_JOB_TOKEN: ${{ secrets.JOB_API_TOKEN }}
          FULL_FUNCTIONAL_JOB_TOKEN_HEADER: "x-api-key"
          FULL_FUNCTIONAL_JOB_RATE_LIMIT_ASSERT: "1"
          FULL_FUNCTIONAL_JOB_RATE_LIMIT_BURST: "120"
        run: |
          if [ -z "${FULL_FUNCTIONAL_JOB_TOKEN}" ]; then
            echo "[SKIP] JOB_API_TOKEN secret not set; full-functional evidence checks skipped."
            exit 0
          fi
          ./scripts/full-functional-check.sh
