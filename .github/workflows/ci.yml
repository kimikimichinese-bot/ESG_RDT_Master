name: ci

on:
  push:
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Lint web package
        run: bun run workspace:lint
      - name: Build web package
        run: bun run workspace:build
      - name: Typecheck
        run: bun run typecheck
      - name: Verify Prisma schema
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Skipping db:check for pull_request event."
          elif [ -n "${DATABASE_URL:-}" ]; then
            bun run db:check
          else
            echo "Skipping db:check: DATABASE_URL not set in this CI context."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Test
        run: bun run test --if-present
